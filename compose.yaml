services:
  caddy:
    image: caddy:2-alpine
    container_name: cinco-site-caddy
    restart: unless-stopped

    ports:
      - "127.0.0.1:8080:80"

    volumes:
      - ./site:/srv:ro
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

    networks:
      - web

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cinco-site-cloudflared
    restart: unless-stopped

    command: tunnel --no-autoupdate run

    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN}

    networks:
      - web

networks:
  web:

volumes:
  caddy_data:
  caddy_config:
