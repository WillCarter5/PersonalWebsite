services:
  caddy:
    image: caddy:2-alpine
    container_name: my-site-caddy
    restart: unless-stopped

    volumes:
      - ./site:/srv:ro
      - caddy_data:/data
      - caddy_config:/config
      - ./Caddyfile:/etc/caddy/Caddyfile:ro

    networks:
      - web

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: my-site-cloudflared
    restart: unless-stopped

    command: tunnel --no-autoupdate run

    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN}

    networks:
      - web

networks:
  web:

volumes:
  caddy_data:
  caddy_config:
