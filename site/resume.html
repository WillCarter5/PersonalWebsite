<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Will Carter - Resume</title>
	<script>
		(() => {
			let theme;
			try {
				theme = localStorage.getItem('home-theme');
			} catch (error) {
				theme = null;
			}
			if (theme !== 'light' && theme !== 'dark') {
				theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
			}
			document.documentElement.dataset.homeTheme = theme;
		})();
	</script>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
	<link rel="stylesheet" href="styles.css">
</head>
	<body class="simple-home">
	<a class="home-skip-link" href="#main-content">Skip to content</a>
	<header class="reading-header">
		<div class="reading-column reading-header__inner">
			<a class="reading-brand" href="home.html">Will Carter</a>
			<nav class="reading-nav" aria-label="Main navigation">
				<a href="index.html">Home</a>
				<a href="projects.html">Projects</a>
				<a href="resume.html" aria-current="page">Resume</a>
				<a href="contact.html">Contact</a>
			</nav>
			<button class="theme-switch" id="theme-toggle" type="button" aria-pressed="false">
				<span class="theme-switch__icon" aria-hidden="true">◐</span>
				<span>Dark mode</span>
			</button>
		</div>
	</header>

	<main class="reading-column home-content" id="main-content">
		<section class="content-module content-module--intro" aria-labelledby="page-title">
			<p class="home-kicker">EXPERIENCE <span aria-hidden="true">/</span> RÉSUMÉ</p>
			<h1 id="page-title">Resume</h1>
			<p class="home-lead">View my resume below or download a copy.</p>
			<p class="home-section-link"><a href="James%20Carter%20Resume.pdf" download="James Carter Resume.pdf">Download resume</a></p>
		</section>
		<section class="content-module content-module--projects" aria-label="Resume document">
			<iframe
				class="resume-viewer"
				src="James%20Carter%20Resume.pdf"
				title="Will Carter resume PDF">
				<p>Your browser cannot display the PDF. <a href="James%20Carter%20Resume.pdf" download="James Carter Resume.pdf">Download the resume</a>.</p>
			</iframe>
		</section>
	</main>

	<footer class="reading-column home-footer">
		<span>&copy; 2026 Will Carter</span>
		<a href="#main-content">Back to top</a>
	</footer>

	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
	<script src="script.js"></script>
</body>
</html>
